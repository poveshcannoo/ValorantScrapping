name: VLR Match & Odds Scraper

on:
  schedule:
    - cron: "*/15 * * * *" # Runs automatically every 15 minutes
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants permission to commit updated CSV and JSON files back to the repo

jobs:
  scrape-vlr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: |
          python vlr_live_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_matches.json vlr_matches_with_odds.csv
          git commit -m "Automated update: match results and odds" || echo "No changes to commit"
          git push
