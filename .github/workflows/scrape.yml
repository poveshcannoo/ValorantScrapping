name: VLR Match & Odds Scraper

on:
  schedule:
    - cron: "*/15 * * * *" # Runs automatically every 15 minutes
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Crucial: Grants permission to commit files back to the repo

jobs:
  scrape-vlr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Updated to v4 to fix Node.js deprecation warning

      - name: Setup Python
        uses: actions/setup-python@v5 # Updated to v5 to fix Node.js deprecation warning
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: |
          python vlr_live_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Using git add -A ensures we don't get a 128 error if the CSV file isn't created yet
          git add -A
          
          # Only commit and push if there are actual changes made to the files
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: match results and odds" && git push)
